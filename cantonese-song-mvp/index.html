<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>粵語學歌 · Song Lesson Builder</title>
<style>
:root{--bg:#f2efe7;--card:#fffdfa;--ink:#151714;--muted:#6f736d;--line:#ddd8ce;--green:#175f50;--red:#a54339;--amber:#a06c13;--neutral:#a8aaa6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC",sans-serif}.wrap{max-width:940px;margin:auto;padding:42px 18px 90px}
.ey{font-size:11px;font-weight:800;letter-spacing:.17em;color:var(--muted)}h1{font-size:clamp(40px,8vw,70px);letter-spacing:-.055em;margin:8px 0}.sub{color:var(--muted);line-height:1.6}.pill{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;margin:18px 0;padding:22px;box-shadow:0 15px 45px rgba(20,20,15,.045)}
.builder textarea{width:100%;min-height:190px;resize:vertical;border:1px solid var(--line);border-radius:15px;background:#fff;padding:14px;font:inherit;font-size:18px;line-height:1.65;color:var(--ink)}.builderActions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.builderHint{font-size:12px;color:var(--muted)}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
.lineNo{font-size:12px;color:var(--muted);font-weight:800}.lyric{font-size:clamp(25px,5vw,40px);font-weight:800;line-height:1.35;letter-spacing:-.025em;margin:10px 0 14px}
.syls{display:flex;gap:7px;flex-wrap:wrap}.syl{min-width:58px;text-align:center;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:8px 9px;cursor:pointer;transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease}.syl:hover{border-color:#9fb9b1}.syl:active{transform:scale(.96)}.syl.playing{border-color:var(--green);box-shadow:0 0 0 3px rgba(23,95,80,.13)}.syl b{font-size:20px;display:block}.syl code{font-size:12px;color:var(--green)}.tapHint{display:block;margin-top:3px;font-size:9px;color:var(--muted);font-weight:700}.lineWarn{font-size:11px;color:var(--amber);margin-top:8px}
.speedRow{display:flex;align-items:center;gap:10px;margin-top:16px}.speedRow label{font-size:12px;font-weight:800;color:var(--muted)}.speechSpeed{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 10px;font:inherit;font-size:13px;color:var(--ink)}
.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:12px;padding:12px 15px;font:inherit;font-weight:800;background:var(--ink);color:#fff;cursor:pointer}button:disabled{opacity:.4}.listen{background:var(--green)}.record{background:var(--red)}.status{font-size:13px;color:var(--muted);background:#f4f1ea;border-radius:11px;padding:10px 12px;margin-top:11px}
.result{margin-top:18px;border-top:1px solid var(--line);padding-top:18px}.hidden{display:none}.summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}.metric{background:#f4f1ea;border-radius:14px;padding:13px}.metric span{display:block;color:var(--muted);font-size:11px}.metric strong{font-size:30px}.chars{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.charResult{min-width:72px;border:2px solid var(--line);border-radius:14px;padding:9px;text-align:center;background:#fff;cursor:pointer}.charResult.ok{border-color:#86b7aa}.charResult.tone{border-color:#d2aa59}.charResult.segmental{border-color:#d28d59}.charResult.wrong{border-color:#cf8179}.charResult.unrated{border-color:var(--neutral);border-style:dashed}.charResult b{font-size:25px;display:block}.charResult code{font-size:11px;color:var(--muted)}.charResult small{display:block;margin-top:3px}.miniParts{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:5px}.miniParts span{font-size:10px;background:#f4f1ea;border-radius:6px;padding:2px 4px}.detail{margin-top:12px;padding:13px;border-radius:13px;background:#f4f1ea;line-height:1.6}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.g{background:#86b7aa}.a{background:#d2aa59}.r{background:#cf8179}.u{background:var(--neutral)}
audio{width:100%;margin-top:10px}@media(max-width:650px){.summary{grid-template-columns:1fr}.buttons button{flex:1}.builderActions button{width:100%}}
</style></head><body><main class="wrap">
<div class="ey">CANTONESE SONG LESSON BUILDER</div><h1>粵語學歌</h1><span class="pill">Paste lyrics → Listen → Read → Score</span>
<p class="sub">把一首歌的歌詞貼進來。每個換行會變成一句練習：自動生成粵拼、逐字點讀、整句慢速朗讀，以及逐音節跟讀評估。</p>

<section class="card builder">
<div class="ey">LYRICS INPUT</div>
<h2>貼上歌詞</h2>
<textarea id="lyricsInput" maxlength="8000">流水像清得沒帶半顆沙
前身被擱在上游風化</textarea>
<div class="builderActions"><button id="buildSong" type="button">生成歌詞課</button><span class="builderHint">每個換行 = 一句 · 最多 60 行 · ⌘/Ctrl + Enter 生成</span></div>
<div id="buildStatus" class="status">準備建立示例歌詞…</div>
</section>

<div id="health" class="status">正在載入粵語模型…</div>
<div id="lessons"></div>
</main><script src="/app.js?v=dynamic-song-1" defer></script></body></html>
