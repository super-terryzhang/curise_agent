<style>
:root{--bg:#f2efe7;--card:#fffdfa;--ink:#151714;--muted:#6f736d;--line:#ddd8ce;--green:#175f50;--red:#a54339;--amber:#a06c13}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC",sans-serif}.wrap{max-width:900px;margin:auto;padding:42px 18px 90px}
