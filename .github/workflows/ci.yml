name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cruise_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cruise_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: v3_backend
    env:
      DATABASE_URL: "sqlite:///:memory:"
      MIGRATION_TEST_DATABASE_URL: "postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/cruise_migration_test"
      DATA_TABLES_TEST_DATABASE_URL: "postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/cruise_migration_test"
      SECRET_KEY: test-secret-key-for-unit-tests-only
      ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: v3_backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Check architecture boundaries
        run: python scripts/check_arch.py
      - name: Run backend behavior suite
        run: pytest -q
      - name: Build and inspect wheel
        run: |
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir /tmp/cruise-wheel
          python -m pip install --no-deps --target /tmp/cruise-wheel-install /tmp/cruise-wheel/*.whl
          cd /tmp
          PYTHONPATH=/tmp/cruise-wheel-install python -c "import main; from domains.inquiry.standard_template import STANDARD_TEMPLATE_ASSET; from agent.runtime.factory import _SKILLS_ROOT; from pathlib import Path; assert STANDARD_TEMPLATE_ASSET.is_file(); assert list(Path(_SKILLS_ROOT).glob('*/SKILL.md'))"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v3-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: v3-frontend/pnpm-lock.yaml
      - name: Install frontend
        run: pnpm install --frozen-lockfile
      - name: Run frontend behavior suite
        run: pnpm test
      - name: Type-check frontend
        run: pnpm exec tsc --noEmit
      - name: Build frontend
        run: pnpm build
