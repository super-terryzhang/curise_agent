<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>粵語發音教練 · Local VITS</title>
<style>
:root{--bg:#f3f1ea;--card:#fffdfa;--ink:#171916;--muted:#73766f;--line:#dedbd1;--green:#1c5d4f;--red:#a34237}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC",sans-serif}
.wrap{max-width:820px;margin:auto;padding:44px 20px 90px}h1{font-size:clamp(42px,8vw,70px);letter-spacing:-.055em;line-height:.95;margin:8px 0 14px}
p{color:var(--muted);line-height:1.6}.ey{font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:800}.pill{display:inline-block;padding:7px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:800;background:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 14px 40px rgba(20,20,15,.045)}
label{font-size:13px;font-weight:800;display:block;margin:12px 0 7px}input{width:100%;font:inherit;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:19px}
button{font:inherit;font-weight:800;padding:12px 15px;border:0;border-radius:12px;background:var(--ink);color:#fff;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}
.row{display:grid;grid-template-columns:1fr auto;gap:9px}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.green{background:var(--green)}.red{background:var(--red)}
.syllables{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.sy{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 10px;text-align:center;min-width:57px}.sy b{display:block;font-size:20px}.sy small{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--green)}
.status{font-size:13px;color:var(--muted);margin-top:11px;padding:10px 12px;background:#f5f3ed;border-radius:10px}.hidden{display:none}audio{width:100%;margin-top:12px}
.range{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.note{font-size:12px;color:var(--muted)}
@media(max-width:600px){.row{grid-template-columns:1fr}.buttons button{flex:1}}
</style></head><body><main class="wrap">
<div class="ey">CANTONESE PRONUNCIATION COACH</div><h1>粵語發音教練</h1>
<span class="pill">Sherpa-ONNX · Cantonese VITS · No API Key</span>
<p>標準音固定由同一個粵語 VITS 模型生成，不再依賴手機是否安裝粵語 voice。</p>

<section class="card">
<label for="text">練習文字</label>
<div class="row"><input id="text" value="你好嗎" maxlength="120"><button id="analyse" type="button">拆成粵拼</button></div>
<div id="syllables" class="syllables"></div>

<label for="speed">發音速度</label>
<div class="range"><input id="speed" type="range" min="0.7" max="1.25" step="0.05" value="0.9"><b id="speedValue">0.90×</b></div>

<div class="buttons">
<button id="listen" type="button" class="green">▶ 生成並播放標準音</button>
<button id="record" type="button" class="red">● 開始跟讀</button>
</div>
<audio id="standardAudio" controls class="hidden"></audio>
<div id="status" class="status">正在檢查本地 VITS 模型…</div>
</section>

<section class="card">
<div class="ey">YOUR RECORDING</div><h2 style="margin:8px 0">跟讀回放</h2>
<p class="note">這一版先把固定標準音做好。你的錄音仍只留在瀏覽器，不上傳。</p>
<audio id="userAudio" controls class="hidden"></audio>
</section>
</main>
<script src="/vendor/cantojpmin_data.js?v=1" defer></script>
<script src="/vendor/cantojpmin_functions.js?v=1" defer></script>
<script src="/app.js?v=vits-1" defer></script>
</body></html>
