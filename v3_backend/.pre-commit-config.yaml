repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: arch-check
        name: module boundary check
        entry: python scripts/check_arch.py
        language: system
        pass_filenames: false
        types: [python]
