[project]
name = "cruise-backend-v3"
version = "3.0.0"
description = "Cruise procurement backend — v3 with proper domain boundaries"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # Web framework
    # Release security baseline: Starlette form limits and Range parsing fixes.
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn[standard]>=0.30.0,<0.40.0",
    "slowapi>=0.1.9",
    # Data
    "sqlalchemy>=2.0.30,<2.1.0",
    "alembic>=1.13.0,<2.0.0",
    "psycopg2-binary>=2.9.9",
    "sqlglot==30.18.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0",
    # Auth — bcrypt version locked due to passlib 1.7.4 incompatibility with bcrypt>=5
    # See v2 CLAUDE.md "bcrypt Version Lock Fix"
    "passlib==1.7.4",
    "bcrypt==4.2.1",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "python-multipart>=0.0.9",
    # Utilities
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0,<1.0.0",
    # Document parsing
    "pypdfium2>=4.27.0,<5.0.0",       # PDF text extraction (lighter than pdfminer)
    "openpyxl>=3.1.0,<4.0.0",         # .xlsx tables
    # Pillow — image processing for ProductImage thumbnails (R5 2026-06-22).
    # We depend on it directly in domains/masterdata/images/thumbnails.py
    # (generate_thumbnails -> 80px + 400px + EXIF-normalized JPEG). Was
    # transitively present via markitdown's chain, but pinning explicitly
    # protects us from upstream removing it.
    "Pillow>=10.0.0,<14.0.0",
    # Microsoft markitdown — universal document → markdown for the long-tail
    # formats not covered by the lighter direct extractors above. Extras chosen
    # to cover Word (.docx via mammoth), PowerPoint (.pptx), and legacy Excel
    # (.xls via xlrd). PDF + .xlsx stay on pypdfium2 + openpyxl to avoid
    # pulling in pdfminer / pandas at import time.
    "markitdown[docx,pptx,xls]>=0.1.5,<0.2.0",
    # Agent platform (Phase 6)
    "google-genai>=1.0.0",
    "jsonschema==4.26.0",  # Oracle model response validation
    # Vendored `general_agent` runtime — see Step 1/3 of TODO-001 (2026-05-08).
    # The package itself lives in v3_backend/general_agent/; these are the
    # external deps it needs at runtime. openai is its OpenAI-compatible LLM
    # client (used to talk to Gemini's /v1 endpoint); requests is used by the
    # legacy weather plugin and a couple of skill HTTP helpers; pyyaml backs
    # skill / scenario manifest loading.
    "openai>=1.40.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    # Google Cloud Storage backend for prod file storage.
    # Lazy-imported in infrastructure/storage/gcs.py so local dev doesn't need it.
    "google-cloud-storage>=2.10.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "apps",
    "agent",
    "domains",
    "infrastructure",
    "shared",
    "general_agent",
    "general_agent.toolkit",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-python-jose",
    "types-passlib",
    "pre-commit>=3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "C4",  # comprehensions
]
ignore = [
    "E501",  # line-length is handled by formatter
    "B008",  # FastAPI's Depends() is a common pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # allow assert False in tests

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "scripts/"]

[[tool.mypy.overrides]]
module = [
    "jose.*",
    "passlib.*",
    "slowapi.*",
    "pypdfium2.*",
    "openpyxl.*",
    "markitdown.*",
    "supabase.*",
    "google.*",
    "google.genai.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Active test root is `test_v2/` (the 2026-05-13 rewrite). The legacy
# `tests/` tree was deleted; this default ensures `pytest` with no args
# discovers the right suite both locally and in CI.
testpaths = ["test_v2"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: unit tests (fast, no I/O)",
    "integration: integration tests (DB, external services)",
    "contract: API contract tests against v2 baseline",
    "e2e: end-to-end tests (real HTTP + real DB)",
]

[tool.coverage.run]
branch = true
source = ["domains", "apps", "infrastructure", "shared", "agent"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
