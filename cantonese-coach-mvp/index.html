<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>粵語發音教練</title>
<style>
:root{--bg:#f3f1ea;--card:#fffdfa;--ink:#171916;--muted:#73766f;--line:#dedbd1;--green:#1c5d4f;--red:#a34237}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC",sans-serif}
.wrap{max-width:820px;margin:auto;padding:48px 20px 90px}h1{font-size:clamp(42px,8vw,72px);letter-spacing:-.055em;line-height:.95;margin:8px 0 14px}
p{color:var(--muted);line-height:1.6}.ey{font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 14px 40px rgba(20,20,15,.045)}
label{font-size:13px;font-weight:800;display:block;margin:12px 0 7px}input{width:100%;font:inherit;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:18px}
button{font:inherit;font-weight:800;padding:12px 15px;border:0;border-radius:12px;background:var(--ink);color:#fff;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}
.row{display:grid;grid-template-columns:1fr auto;gap:9px}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.green{background:var(--green)}.red{background:var(--red)}
.syllables{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.sy{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 10px;text-align:center;min-width:57px}
.sy b{display:block;font-size:20px}.sy small{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--green)}
.status{font-size:13px;color:var(--muted);margin-top:11px;padding:10px 12px;background:#f5f3ed;border-radius:10px}.hidden{display:none}
.score{font-size:76px;font-weight:800;letter-spacing:-.06em}.head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}
.badge{padding:8px 11px;border-radius:999px;background:#e8f0ec;color:var(--green);font-weight:800;font-size:12px}.badge.bad{background:#f7e8e5;color:var(--red)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}.pair div{background:#f5f3ed;padding:13px;border-radius:12px}.pair span{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}
.pair strong{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.diag{display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.diag code{font-weight:800}.ok{color:var(--green)}.bad{color:var(--red)}.tone{display:flex;justify-content:space-between;background:#f5f3ed;padding:13px 15px;border-radius:12px;margin-top:16px}
.tone strong{font-size:26px}.note{font-size:12px;color:var(--muted)}audio{width:100%;margin-top:12px}
@media(max-width:600px){.row,.pair{grid-template-columns:1fr}.diag{grid-template-columns:1fr 1fr}.diag span{grid-column:1/-1}.buttons button{flex:1}}
</style>
</head>
<body>
<main class="wrap">
<div class="ey">CANTONESE PRONUNCIATION COACH</div>
<h1>粵語發音教練</h1>
<p>先把文字拆成粵拼，再聽標準粵語、跟讀並檢查聲調。</p>

<section class="card">
<label for="key">Cantonese.ai API Key</label>
<input id="key" type="password" autocomplete="off" placeholder="只保存在此瀏覽器分頁">

<form id="practiceForm" method="get" action="/practice">
<label for="text">練習文字</label>
<div class="row">
<input id="text" name="text" value="你好嗎" maxlength="120">
<button id="analyse" type="submit">拆成粵拼</button>
</div>
</form>

<div id="syllables" class="syllables"></div>
<div class="buttons">
<button id="listen" type="button" class="green" disabled>▶ 聽標準音</button>
<button id="record" type="button" class="red" disabled>● 開始跟讀</button>
</div>
<audio id="audio" controls class="hidden"></audio>
<div id="status" class="status">前端載入中…</div>
</section>

<section id="result" class="card hidden">
<div class="head"><div><div class="ey">PRONUNCIATION SCORE</div><div id="score" class="score">—</div></div><div id="pass" class="badge">—</div></div>
<div class="pair"><div><span>目標粵拼</span><strong id="expected">—</strong></div><div><span>系統聽到</span><strong id="heard">—</strong></div></div>
<label>逐音節診斷</label><div id="diags"></div>
<div class="tone"><span>聲調命中率</span><strong id="tone">—</strong></div>
</section>

<section class="card"><b>Fallback</b><p class="note">即使 JavaScript 沒有執行，「拆成粵拼」仍會作為普通表單打開伺服器版結果頁。這樣核心功能不會因前端錯誤完全失效。</p></section>
</main>
<script src="/app.js?v=20260924h" defer></script>
</body>
</html>
